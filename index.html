  .theme-switch__label {

  .theme-switch__btn {

    padding: 6px 12px;
    cursor: pointer;

  .theme-switch__btn:hover { border-color: #888; }

    color: #000;
    border-color: #fff;

</style>

<script>
/* ---------- Theme switcher ---------- */
(function () {
  var THEMES = { original: "themes/original.css", "neo-brutalist": "themes/neo-brutalist.css" };
  var STORAGE_KEY = "tv-theme";
  var link = document.getElementById("theme-stylesheet");
  var buttons = document.querySelectorAll(".theme-switch__btn");

  function apply(theme) {
    if (!THEMES[theme]) theme = "original";
    link.href = THEMES[theme];
    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
    buttons.forEach(function (b) {
      b.classList.toggle("is-active", b.dataset.theme === theme);
    });
  }

  var saved;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  apply(saved || "original");

  buttons.forEach(function (b) {
    b.addEventListener("click", function () { apply(b.dataset.theme); });
  });
})();
</script>

/* ---------- Rendering ---------- */

const homeView = document.getElementById("home-view");
const projectView = document.getElementById("project-view");
const processList = document.getElementById("process-list");
const pageTitle = document.getElementById("page-title");
const backBtn = document.getElementById("back-btn");
const projectDescription = document.getElementById("project-description");
const projectTools = document.getElementById("project-tools");
const stepGroups = document.getElementById("step-groups");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxClose = document.getElementById("lightbox-close");

backBtn.innerHTML = icons.arrowLeft;
lightboxClose.innerHTML = icons.close;

function renderHome() {
  processList.innerHTML = Object.entries(processes).map(([id, process]) => `
    <button class="card-project" data-process="${id}">
      <span>${process.title}</span>
      ${icons.chevronRight}
    </button>
  `).join("");
}

function renderTask(task) {
  const hasPhotos = task.photos && task.photos.length > 0;
  return `
    <div class="card-task">
      <button class="card-task__header">
        <span>${task.title}</span>
        ${icons.chevronDown}
      </button>
      <div class="card-task__body">
        ${task.detail ? `
          <div>
            <p class="card-task__section-label">Ohjeet</p>
            <p class="card-task__section-text">${task.detail}</p>
          </div>
        ` : ""}
        ${task.tools ? `
          <div>
            <p class="card-task__section-label">Työkalut</p>
            <p class="card-task__section-text">${task.tools}</p>
          </div>
        ` : ""}
        ${hasPhotos ? `
          <div>
            <p class="card-task__section-label">Liitteet</p>
            <div class="attachments-grid">
              ${task.photos.map(ref => {
                const src = PHOTOS[ref] || ref;
                return `
                <button class="attachment-thumb" data-photo="${src}">
                  <img src="${src}" alt="" loading="lazy">
                </button>`;
              }).join("")}
            </div>
          </div>
        ` : ""}
        ${task.warning ? `
          <div class="alert-box">
            ${icons.warning}
            <div>
              <p class="alert-box__title">Huomio</p>
              <p class="alert-box__text">${task.warning}</p>
            </div>
          </div>
        ` : ""}
      </div>
    </div>
  `;
}

function renderProject(id) {
  const process = processes[id];
  projectDescription.textContent = process.description;
  const hasTools = process.tools && process.tools.length > 0;
  projectTools.innerHTML = hasTools ? `
    <p class="page-tools__label">Tarvittavat työkalut</p>
    ${process.tools.map(t => `<p class="page-tools__row">${t.cabin}: ${t.items}.</p>`).join("")}
  ` : "";
  projectTools.hidden = !hasTools;

  stepGroups.innerHTML = process.groups.map(group => `
    <div class="step-group">
      <div class="step-group__header">
        <p class="step-group__label">${group.label}</p>
        ${group.name ? `<p class="step-group__name">${group.name}</p>` : ""}
      </div>
      <div class="task-list">
        ${group.tasks.map(renderTask).join("")}
      </div>
    </div>
  `).join("");
}

function showHome() {
  homeView.hidden = false;
  projectView.hidden = true;
  backBtn.hidden = true;
  pageTitle.textContent = "Taavetin vedet";
}

function showProject(id) {
  renderProject(id);
  homeView.hidden = true;
  projectView.hidden = false;
  backBtn.hidden = false;
  pageTitle.textContent = processes[id].title;
  projectView.scrollTop = 0;
  window.scrollTo(0, 0);
}

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.hidden = false;
}

function closeLightbox() {
  lightbox.hidden = true;
  lightboxImg.src = "";
}

/* ---------- Events ---------- */

processList.addEventListener("click", (e) => {
  const card = e.target.closest(".card-project");
  if (card) showProject(card.dataset.process);
});

backBtn.addEventListener("click", showHome);

stepGroups.addEventListener("click", (e) => {
  const header = e.target.closest(".card-task__header");
  if (header) {
    const card = header.closest(".card-task");
    const expanded = card.classList.toggle("is-expanded");
    header.querySelector(".icon").outerHTML = expanded ? icons.chevronUp : icons.chevronDown;
    return;
  }
  const thumb = e.target.closest(".attachment-thumb");
  if (thumb) openLightbox(thumb.dataset.photo);
});

lightboxClose.addEventListener("click", closeLightbox);
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !lightbox.hidden) closeLightbox();
});

renderHome();
showHome();
</script>
